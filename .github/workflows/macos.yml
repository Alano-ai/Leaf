name: macOS build and release

"on":
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: macos-${{ github.ref }}

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      notarized: ${{ steps.package.outputs.notarized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          xcodebuild -version
          version=0.0.0
          if [[ -n $RELEASE_TAG ]]; then
            version=${RELEASE_TAG#v}
          fi
          pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$'
          if [[ ! $version =~ $pattern ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N." >&2
            exit 1
          fi
          printf 'version=%s\ncommit=%s\n' "$version" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test Leaf
        run: |
          xcodebuild -project Leaf.xcodeproj -scheme Leaf -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/test test
      - name: Test vendored ZIP validation and standalone conversion
        run: |
          xcrun swift test --package-path Dependencies/ReaderLibraries --scratch-path build/reader-libraries-tests
          xcrun swift test --package-path Packages/LeafConversion --scratch-path build/conversion-tests
      - name: Package and verify DMG
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LEAF_CERTIFICATE_P12: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.LEAF_CERTIFICATE_P12 || '' }}
          LEAF_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.LEAF_CERTIFICATE_PASSWORD || '' }}
          LEAF_NOTARY_KEY: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.LEAF_NOTARY_KEY || '' }}
          LEAF_NOTARY_KEY_ID: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.LEAF_NOTARY_KEY_ID || '' }}
          LEAF_NOTARY_ISSUER_ID: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.LEAF_NOTARY_ISSUER_ID || '' }}
        run: bash scripts/package-dmg.sh "$VERSION"
      - name: Archive matching source and compute checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          git archive --format=tar.gz --prefix="Leaf-$VERSION/" \
            --output="build/distribution/Leaf-$VERSION-source.tar.gz" "$COMMIT"
          cd build/distribution
          shasum -a 256 "Leaf-$VERSION-arm64.dmg" "Leaf-$VERSION-source.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Leaf-distribution
          path: |
            build/distribution/*.dmg
            build/distribution/*-source.tar.gz
            build/distribution/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Leaf-distribution
          path: distribution
      - name: Publish GitHub Release
        working-directory: distribution
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.build.outputs.commit }}
          NOTARIZED: ${{ needs.build.outputs.notarized }}
        run: |
          sha256sum --check SHA256SUMS
          actual_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [[ $actual_commit != "$COMMIT" ]]; then
            echo "The release tag no longer points to the commit that was built." >&2
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          assets=("Leaf-$version-arm64.dmg" "Leaf-$version-source.tar.gz" SHA256SUMS)
          if [[ $NOTARIZED != true && $NOTARIZED != false ]]; then
            echo "The build did not report its notarization status." >&2
            exit 1
          fi

          title="Leaf $GITHUB_REF_NAME"
          release_flags=(--latest)
          if [[ $version == *-beta.* || ( $version == 0.* && $NOTARIZED == false ) ]]; then
            title="$title Preview"
            release_flags=(--prerelease --latest=false)
          fi

          notes=$(mktemp)
          trap 'rm -f "$notes"' EXIT
          ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME"
          tag_object=$(gh api "$ref" --jq 'if .object.type == "tag" then .object.sha else "" end')
          if [[ -n $tag_object ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .message > "$notes"
          fi
          printf '\n## Download\n\n' >> "$notes"
          printf '%s\n' 'For Apple Silicon Macs running macOS 26 or later. The DMG contains a drag-to-Applications installer. The source archive contains the exact build inputs.' >> "$notes"
          if [[ $NOTARIZED == false ]]; then
            printf '\n%s\n' '本构建采用临时签名，尚未经过 Apple 公证。首次打开时，macOS Gatekeeper 可能会阻止启动。' >> "$notes"
            printf '\n%s\n' 'This build is ad-hoc signed. Apple notarization has not been applied, so macOS Gatekeeper may block the first launch.' >> "$notes"
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$title" --notes-file "$notes" --generate-notes "${release_flags[@]}"
